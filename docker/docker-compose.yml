# Postgres and Redis are NOT run in Docker.
# Install them natively and point the app at them via .env
# (DATABASE_URL / REDIS_URL default to localhost).
#
# The app services below are optional; they read connection values from
# ../.env and reach the host's native Postgres/Redis through
# host.docker.internal so no DB/Redis container is needed.
version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    env_file: ../.env
    # DATABASE_URL and REDIS_URL come from ../.env. The overrides below only
    # swap "localhost" for "host.docker.internal" so a containerized api can
    # reach the natively-installed Postgres/Redis on the host.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-ai_portfolio}?schema=public
      REDIS_URL: redis://host.docker.internal:${REDIS_PORT:-6379}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && node dist/src/main.js"

  worker:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-ai_portfolio}?schema=public
      REDIS_URL: redis://host.docker.internal:${REDIS_PORT:-6379}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: node dist/src/workers/ingestion.worker.js

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    environment:
      API_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
