name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: ai_portfolio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portfolio"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @ai-portfolio/api prisma:generate
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://portfolio:portfolio@localhost:5432/ai_portfolio_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
